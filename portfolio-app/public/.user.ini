; PHP settings for PHP-FPM / cPanel hosting (read from the web root).
; Upload limits: files up to 100 MB (the app checks 100 MB; post_max_size must be a little larger).
; Large uploads also need more time to arrive and memory to resize photos.
upload_max_filesize = 100M
post_max_size = 110M
max_input_time = 300
max_execution_time = 300
memory_limit = 512M
